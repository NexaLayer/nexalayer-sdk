[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexalayer"
version = "0.1.5"
description = "Python SDK for NexaLayer MCP and proxy sessions for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "NexaLayer" }]
keywords = ["mcp", "ai-agents", "proxy", "session", "nexalayer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[project.urls]
Homepage = "https://www.nexalayer.net"
Documentation = "https://docs.nexalayer.net"
Repository = "https://github.com/NexaLayer/nexalayer-sdk"
Issues = "https://github.com/NexaLayer/nexalayer-sdk/issues"

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
