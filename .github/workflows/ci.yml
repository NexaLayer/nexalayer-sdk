name: SDK CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: node
        run: npm install
      - name: Type check and build
        working-directory: node
        run: npm run build
      - name: Validate public strings
        run: |
          ! grep -R "out_dynamic_1\|docs.nexalayer.com\|api.nexalayer.com\|agk_[A-Za-z0-9_-]\{12,\}\|railway.internal\|/Users/" --exclude-dir=.git --exclude-dir=node_modules .

