name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts and validate npm credentials without publishing
        type: boolean
        default: true
      publish_testpypi:
        description: Publish the current version to TestPyPI to verify trusted publishing
        type: boolean
        default: false
      publish_pypi:
        description: Publish to PyPI when dry_run is false
        type: boolean
        default: false
      publish_npm:
        description: Publish to npm when dry_run is false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install twine && python -m twine check dist/*
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.publish_testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'release' || (!inputs.dry_run && inputs.publish_pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Verify PyPI visibility
        if: github.event_name == 'release' || (!inputs.dry_run && inputs.publish_pypi)
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for attempt in 1 2 3 4 5; do
            python -m pip index versions nexalayer | grep -F "$VERSION" && exit 0
            sleep 15
          done
          exit 1

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: node
      - name: Verify npm credentials
        run: npm whoami
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry-run npm package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish npm package
        if: github.event_name == 'release' || (!inputs.dry_run && inputs.publish_npm)
        run: npm publish --access public --provenance
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public scoped npm package
        if: github.event_name == 'release' || (!inputs.dry_run && inputs.publish_npm)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5; do
            [ "$(npm view @nexalayer/sdk version)" = "$VERSION" ] && exit 0
            sleep 15
          done
          exit 1
        working-directory: node
