name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts and validate npm credentials without publishing
        type: boolean
        default: true
      publish_testpypi:
        description: Publish the current version to TestPyPI to verify trusted publishing
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install twine && python -m twine check dist/*
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.publish_testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'release' || !inputs.dry_run
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: node
      - name: Verify npm credentials
        run: npm whoami
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry-run npm package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish npm package
        if: github.event_name == 'release' || !inputs.dry_run
        run: npm publish --access public --provenance
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
